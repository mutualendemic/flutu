name: Build SnapDeploy release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and verify SnapDeploy ZIP
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/create_snapdeploy_zip.py --output "dist/flutu-snapdeploy-${RELEASE_TAG}.zip"

      - name: Attach ZIP to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "dist/flutu-snapdeploy-${RELEASE_TAG}.zip" --clobber