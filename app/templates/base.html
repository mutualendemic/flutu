<!DOCTYPE html>
<html lang="{{ get_locale().replace('_', '-') }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f7ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <title>{% block title %}ux9.eu{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        --page-bg: #f3f7ff;
        --page-glow: #f9fbff;
        --page-mid: #eaf3ff;
        --surface: rgba(255,255,255,.96);
        --surface-solid: #fff;
        --surface-muted: #fbfcff;
        --text: #14213d;
        --muted: #53627b;
        --border: #dfe8ff;
        --input-border: #cfd7e6;
        --input-bg: #fff;
        --link: #3655d4;
        --eyebrow: #4f6fff;
        --code-bg: #f0f3fa;
        --shadow: rgba(69,91,157,.16);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background: var(--page-bg);
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 24px; background: radial-gradient(circle at top left, var(--page-glow), var(--page-mid) 35%, var(--page-bg) 78%); }
      a { color: var(--link); }
      .card { width: min(100%, 780px); margin: 0 auto; padding: clamp(24px, 5vw, 40px); border: 1px solid var(--border); border-radius: 26px; background: var(--surface); box-shadow: 0 20px 55px var(--shadow); }
      .eyebrow { margin: 0 0 10px; color: var(--eyebrow); font-size: .8rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 5vw, 2.5rem); letter-spacing: -.04em; }
      p, li { color: var(--muted); line-height: 1.65; }
      .button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 14px; padding: 14px 18px; border: 0; border-radius: 12px; background: linear-gradient(135deg, #4f6fff, #6a8dff); color: white; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
      .button:hover { background: #2d4ed0; }
      .button:disabled, button[aria-busy="true"] { opacity: .58; cursor: wait; }
      .button[aria-busy="true"] { pointer-events: none; }
      .button-secondary { background: var(--surface-solid); border: 1px solid var(--border); color: var(--text); }
      .button-secondary:hover { background: var(--surface-muted); }
      .back-link { display: inline-block; margin-top: 24px; font-weight: 700; text-decoration: none; }
      .back-link:hover { text-decoration: underline; }
      .language-picker { display:flex; justify-content:flex-end; gap:6px; width:min(100%,1100px); margin:0 auto 12px; }
      .language-picker button { padding:7px 10px; border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--text); font:inherit; cursor:pointer; }
      .language-picker button[aria-current="true"] { border-color:var(--link); font-weight:700; }
      .error { margin: 12px 0; color: #b42318; }
      .sharing-status { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 16px; padding: 8px 12px; border: 1px solid #d9dee8; border-radius: 999px; background: #f7f8fa; color: #53627b; font-size: .85rem; font-weight: 700; }
      .sharing-status::before { width: 8px; height: 8px; border-radius: 50%; background: #98a2b3; content: ""; }
      .sharing-status.is-sharing { border-color: #a6f4c5; background: #ecfdf3; color: #067647; }
      .sharing-status.is-sharing::before { background: #12b76a; box-shadow: 0 0 0 3px #d1fadf; }
      .sharing-status.is-paused { border-color: #fedf89; background: #fffaeb; color: #93370d; }
      .sharing-status.is-paused::before { background: #f79009; }
      code { padding: 2px 5px; border-radius: 5px; background: var(--code-bg); }
      {% block styles %}{% endblock %}
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --page-bg: #0b1220;
          --page-glow: #16233a;
          --page-mid: #111b2d;
          --surface: rgba(21,31,50,.97);
          --surface-solid: #17243a;
          --surface-muted: #1d2b42;
          --text: #e6edf7;
          --muted: #b1bfd3;
          --border: #304058;
          --input-border: #40516c;
          --input-bg: #101a2b;
          --link: #a8bdff;
          --eyebrow: #a8bdff;
          --code-bg: #26344c;
          --shadow: rgba(0,0,0,.38);
        }
        body { background: radial-gradient(circle at top left, var(--page-glow), var(--page-mid) 42%, var(--page-bg) 82%); }
        .card, .panel, .contact-card, .profile-note, .note, .item { background-color: var(--surface); border-color: var(--border); }
        .panel, .contact-card, .profile-note, .item { background-color: var(--surface-muted); }
        .manual-form input, .search, select, input, textarea {
          border-color: var(--input-border);
          background-color: var(--input-bg);
          color: var(--text);
        }
        .manual-form label, .count, .subtle, .map-caption, .item-copy span, .notice, .empty, .build-version { color: var(--muted); }
        input::placeholder, textarea::placeholder { color: #95a5bd; }
        .button-secondary { background: var(--surface-solid); border-color: var(--border); color: var(--text); }
        .button-secondary:hover, .item-actions button:hover { background: var(--surface-muted); }
        .logout { background: #263859; color: #dce6ff; }
        .avatar { border-color: var(--border); background: #1d2b42; color: #b8c8ff; }
        .note { color: var(--text); }
        .empty { border-color: var(--border); }
        .remove-contact { border-color: #70423f; background: var(--surface-solid); color: #ffaaa3; }
        .item-actions button { border-color: var(--border); background: var(--surface-solid); color: var(--text); }
        .sharing-status { border-color: var(--border); background: var(--surface-muted); color: var(--muted); }
        .sharing-status.is-sharing { border-color: #176b4a; background: #123b30; color: #8ce0b1; }
        .sharing-status.is-paused { border-color: #765520; background: #423219; color: #ffd27d; }
        .error, .notice.error, #answer[data-state="error"] { color: #ff9b93; }
        .notice.success, #answer[data-state="true"] { color: #8ce0b1; }
        #answer[data-state="false"] { color: #ffc078; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip, .leaflet-control-zoom a, .leaflet-control-attribution {
          background: #17243a;
          color: var(--text);
        }
        .leaflet-control-zoom a { border-color: var(--border); }
        .leaflet-control-attribution a { color: var(--link); }
      }
    </style>
  </head>
  <body>
    <nav class="language-picker" aria-label="{{ _('Site language') }}">
      {% for locale, label in [('en_GB', 'English (UK)'), ('pt_PT', 'Português (Portugal)')] %}
        <form method="post" action="{{ url_for('main.set_language', locale=locale) }}">
          <input type="hidden" name="next" value="{{ request.full_path.rstrip('?') }}" />
          <button type="submit" {% if get_locale() == locale %}aria-current="true"{% endif %}>{{ label }}</button>
        </form>
      {% endfor %}
    </nav>
    {% block content %}{% endblock %}
    <script>window.FlutuI18n = {{ get_ui_messages()|tojson }};</script>
    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='action-loading.js') }}" defer></script>
    {% if session.get('user') %}
      <div id="location-sharing-config"
           data-status-url="{{ url_for('main.api_location_status') }}"
           data-updates-url="{{ url_for('main.api_update_location') }}"
           hidden></div>
      <script src="{{ url_for('static', filename='location-sharing.js') }}" defer></script>
    {% endif %}
  </body>
</html>
